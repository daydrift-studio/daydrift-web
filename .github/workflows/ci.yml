name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run content package tests
        run: pnpm --filter @daydrift/content test

      - name: Check Docs API synchronicity
        run: pnpm --filter @daydrift/docs check:api

      - name: Build Official site
        run: pnpm --filter @daydrift/official build

      - name: Build Docs site
        run: pnpm --filter @daydrift/docs build
